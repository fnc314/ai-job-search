name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'records/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Application Distribution
        run: |
          ./gradlew :backend:service:installDist

      - name: Submit Cloud Build & Deploy to Cloud Run
        run: |
          PROJECT="${{ vars.GCP_PROJECT_ID || 'dev-fnc314-ai-job-tracker' }}"
          REGION="${{ vars.GCP_REGION || 'us-east1' }}"
          SERVICE_NAME="${{ vars.GCP_SERVICE_NAME || 'dev-fnc314-ai-job-tracker-backend' }}"
          IMAGE_URI="${REGION}-docker.pkg.dev/${PROJECT}/${SERVICE_NAME}/backend:${{ github.sha }}"

          echo "Submitting Cloud Build image: ${IMAGE_URI}..."
          gcloud builds submit --tag "${IMAGE_URI}" backend --project="${PROJECT}"

          echo "Deploying to Cloud Run ${SERVICE_NAME} in ${REGION}..."
          ENV_VARS_FLAG=""
          if [ -n "${{ secrets.JOB_TRACKER_API_KEY }}" ]; then
            ENV_VARS_FLAG="--set-env-vars=JOB_TRACKER_API_KEY=${{ secrets.JOB_TRACKER_API_KEY }}"
          fi

          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE_URI}" \
            --region="${REGION}" \
            --project="${PROJECT}" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1 \
            --memory=512Mi \
            --cpu=1 \
            ${ENV_VARS_FLAG}
