name: Deploy Documentation to GitHub Pages

on:
  push:
    tags:
      - 'version/*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: false

      - name: Install required mise tools
        run: |
          mise install python
          mise install gradle

      - name: Configure Gradle init.d and Android SDK Environment
        run: |
          mkdir -p "${HOME}/.gradle/init.d"
          cp gradle/init.d/root.init.gradle.kts "${HOME}/.gradle/init.d/"
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/analytics.settings"
          mkdir -p "${ANDROID_HOME}/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2fa28118083d4d7204f0292bd4f5e7304e420247" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          echo -e "\n859f317696f67ef3d7f30a50a5560e7834b43903" > "${ANDROID_HOME}/licenses/android-sdk-arm-dbt-license"
          echo -e "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "${ANDROID_HOME}/licenses/android-googletv-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "${ANDROID_HOME}/licenses/google-gdk-license"
          echo -e "\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d" > "${ANDROID_HOME}/licenses/mips-android-sysimage-license"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_USER_HOME=${HOME}/.android" >> $GITHUB_ENV

      - name: Generate Dokka API Documentation
        run: mise run docs:generate

      - name: Generate Mise Task Documentation
        run: mise run docs:tasks

      - name: Assemble Public Documentation Site
        run: python3 scripts/build_docs_site.py --output build/gh-pages --domain ai-job-tracker.fnc314.dev

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/gh-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
