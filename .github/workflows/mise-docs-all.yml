concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  mise-docs-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run docs:all
    timeout-minutes: 10

name: mise docs all

on:
  push:
    branches: ["main"]
    tags: ["*"]
  workflow_dispatch:
