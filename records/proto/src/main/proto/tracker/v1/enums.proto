syntax = "proto3";

package tracker.v1;

option java_package = "dev.fnc314.tools.jobsearch.tracker.v1";
option java_multiple_files = true;

// ============================================================================
// TrackerStatus
// Canonical job application funnel lifecycle states.
// Ranks 0-3: Terminal inactive states
// Ranks 4-10: Active funnel states (chronological)
// Rank 11: Terminal success
// ============================================================================
enum TrackerStatus {
  TRACKER_STATUS_UNSPECIFIED = 0;

  // Terminal inactive states (ranks 0-3)
  NO_RESPONSE = 1;            // Employer ghosted (>30 days silence)
  OFFER_DECLINED = 2;         // Candidate declined extended offer
  APPLICATION_WITHDRAWN = 3;  // Candidate voluntarily withdrew
  REJECTED = 4;               // Employer rejected candidate

  // Active funnel states (ranks 4-10)
  DRAFTED = 5;                // Application draft prepared; pending submission
  SUBMITTED = 6;              // Application formally submitted to company/portal
  RECRUITER_SCREENED = 7;     // Initial recruiter screen completed
  INTERVIEWING = 8;           // Multi-round interview loop in progress
  NEGOTIATING_PRE_OFFER = 9;  // Pre-offer compensation/leveling alignment
  OFFER = 10;                 // Formal offer extended to candidate
  NEGOTIATING_POST_OFFER = 11;// Post-offer counter-negotiation

  // Terminal success (rank 11)
  HIRED = 12;                 // Offer accepted, hiring complete
}

// ============================================================================
// InterviewType
// Classification of interview round format and structure
// ============================================================================
enum InterviewType {
  INTERVIEW_TYPE_UNSPECIFIED = 0;
  RECRUITER_SCREEN = 1;
  TECHNICAL_KNOWLEDGE = 2;       // Domain deep dive / Q&A
  TECHNICAL_DEMONSTRATION = 3;   // Coding, pairing, live exercise
  SYSTEMS_DESIGN = 4;            // Distributed systems / architecture
  BEHAVIORAL = 5;                // Leadership principles / culture fit
  ON_SITE = 6;                   // Multi-interview full loop
  FINAL_ROUND = 7;               // Executive / VP wrap-up
}

