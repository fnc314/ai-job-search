syntax = "proto3";

package tracker.v1;

import "google/protobuf/timestamp.proto";

option java_package = "dev.fnc314.tools.jobsearch.tracker.v1";
option java_multiple_files = true;

// TrackerFit — rubric version, evaluatedAt, gaps array
message TrackerFit {
  int32 rubricVersion = 1;
  google.protobuf.Timestamp evaluatedAt = 2;
  repeated string gaps = 3;
}
