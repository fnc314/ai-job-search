<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F5597" />
      <stop offset="100%" stop-color="#1B365D" />
    </linearGradient>

    <!-- Glider Right Wing / Shaded Facet -->
    <linearGradient id="rightWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glider Underside Keel -->
    <linearGradient id="keelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base (Full bleed squircle/rect) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Orbital Compass / Radar Tracking Arc -->
  <!-- Center at (240, 272), r=160 -->
  <path d="M 120 340 A 160 160 0 1 1 390 220" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-opacity="0.35" 
        stroke-width="5" 
        stroke-dasharray="16 10" 
        stroke-linecap="round" />
        
  <!-- Concentric Inner Target Arc -->
  <path d="M 150 310 A 110 110 0 0 1 340 220" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.15" 
        stroke-width="3" 
        stroke-linecap="round" />

  <!-- The Delta Glider Motif (Ascending 45° with 3D origami facets) -->
  <g filter="url(#softShadow)">
    <!-- Underside / Keel Fold: Nose (312, 172) -> Tail (208, 332) -> Keel Center (236, 312) -->
    <polygon points="312,172 208,332 236,312" fill="url(#keelGrad)" />

    <!-- Left Wing (Top illuminated facet): Nose (312, 172) -> Wingtip (136, 272) -> Keel Center (236, 312) -->
    <polygon points="312,172 136,272 236,312" fill="#FFFFFF" />

    <!-- Right Wing (Direct shaded facet): Nose (312, 172) -> Keel Center (236, 312) -> Wingtip (344, 280) -->
    <polygon points="312,172 236,312 344,280" fill="url(#rightWingGrad)" />
  </g>

  <!-- 4-Point AI Spark at flight apex / guidance trajectory -->
  <!-- Centered at (368, 128) -->
  <path d="M 368 96 
           C 368 116 376 128 396 128 
           C 376 128 368 140 368 160 
           C 368 140 360 128 340 128 
           C 360 128 368 116 368 96 Z" 
        fill="url(#sparkGrad)" />

  <!-- Minor Accent Spark (Trailing particle) -->
  <circle cx="396" cy="168" r="4" fill="#FCD34D" opacity="0.8" />
</svg>
