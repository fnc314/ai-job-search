potential-bugs:
  active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: AvoidReferentialEquality
  # ELI5: Warns against using '===' on types like String or boxed primitives where structural '==' is meant.
  # Type: List<String> (forbiddenTypePatterns)
  # Docs: https://detekt.dev/docs/rules/potential-bugs#avoidreferentialequality
  # ─────────────────────────────────────────────────────────────────────────────
  AvoidReferentialEquality:
    active: true
    forbiddenTypePatterns:
      - 'kotlin.String'
  CastNullableToNonNullableType:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: CastToNullableType
  # ELI5: Flags unsafe casts like 'x as String?' which can produce unexpected null reference bugs.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#casttonullabletype
  # ─────────────────────────────────────────────────────────────────────────────
  CastToNullableType:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: Deprecation
  # ELI5: Flags usage of deprecated APIs so technical debt does not accumulate.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#deprecation
  # ─────────────────────────────────────────────────────────────────────────────
  Deprecation:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: DontDowncastCollectionTypes
  # ELI5: Forbids casting read-only collections (List) down to mutable collections (MutableList).
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#dontdowncastcollectiontypes
  # ─────────────────────────────────────────────────────────────────────────────
  DontDowncastCollectionTypes:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: DoubleMutabilityForCollection
  # ELI5: Forbids having 'var' of a 'MutableList'; use 'val' with MutableList or 'var' with immutable List.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#doublemutabilityforcollection
  # ─────────────────────────────────────────────────────────────────────────────
  DoubleMutabilityForCollection:
    active: true
    mutableTypes:
      - 'kotlin.collections.MutableList'
      - 'kotlin.collections.MutableMap'
      - 'kotlin.collections.MutableSet'
      - 'java.util.ArrayList'
      - 'java.util.LinkedHashSet'
      - 'java.util.HashSet'
      - 'java.util.LinkedHashMap'
      - 'java.util.HashMap'
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: ElseCaseInsteadOfExhaustiveWhen
  # ELI5: Encourages exhaustive 'when' on enums and sealed classes without an 'else' so adding variants causes compiler errors.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#elsecaseinsteadofexhaustivewhen
  # ─────────────────────────────────────────────────────────────────────────────
  ElseCaseInsteadOfExhaustiveWhen:
    active: false
    ignoredSubjectTypes: []
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: EqualsAlwaysReturnsTrueOrFalse
  # ELI5: Flags broken equals() methods that hardcode 'return true' or 'return false'.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#equalsalwaysreturnstrueorfalse
  # ─────────────────────────────────────────────────────────────────────────────
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: EqualsWithHashCodeExist
  # ELI5: Ensures that if equals() is overridden, hashCode() is also overridden, preventing HashMap/Set bugs.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#equalswithhashcodeexist
  # ─────────────────────────────────────────────────────────────────────────────
  EqualsWithHashCodeExist:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: ExitOutsideMain
  # ELI5: Forbids calling System.exit() outside of a main function.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#exitoutsidemain
  # ─────────────────────────────────────────────────────────────────────────────
  ExitOutsideMain:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: ExplicitGarbageCollectionCall
  # ELI5: Forbids manual System.gc() calls; the JVM garbage collector should manage memory.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#explicitgarbagecollectioncall
  # ─────────────────────────────────────────────────────────────────────────────
  ExplicitGarbageCollectionCall:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: HasPlatformType
  # ELI5: Flags public properties having ambiguous Java platform types without an explicit Kotlin nullability annotation.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#hasplatformtype
  # ─────────────────────────────────────────────────────────────────────────────
  HasPlatformType:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: IgnoredReturnValue
  # ELI5: Warns when the return value of a method call is ignored on methods that return crucial data.
  # Type: List<String> (returnValueAnnotations)
  # Docs: https://detekt.dev/docs/rules/potential-bugs#ignoredreturnvalue
  # ─────────────────────────────────────────────────────────────────────────────
  IgnoredReturnValue:
    active: true
    restrictToConfig: true
    returnValueAnnotations:
      - 'CheckResult'
      - '*.CheckResult'
      - 'CheckReturnValue'
      - '*.CheckReturnValue'
    ignoreReturnValueAnnotations:
      - 'CanIgnoreReturnValue'
      - '*.CanIgnoreReturnValue'
    returnValueTypes:
      - 'kotlin.sequences.Sequence'
      - 'kotlinx.coroutines.flow.*Flow'
      - 'java.util.stream.*Stream'
    ignoreFunctionCall: []
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: ImplicitDefaultLocale
  # ELI5: Forces specifying Locale (e.g., Locale.US) when converting string cases to avoid regional formatting bugs.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#implicitdefaultlocale
  # ─────────────────────────────────────────────────────────────────────────────
  ImplicitDefaultLocale:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: ImplicitUnitReturnType
  # ELI5: Discourages expression-body functions that evaluate to Unit without stating ': Unit'.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#implicitunitreturntype
  # ─────────────────────────────────────────────────────────────────────────────
  ImplicitUnitReturnType:
    active: false
    allowExplicitReturnType: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: InvalidRange
  # ELI5: Flags backwards progression ranges like '10..1' which evaluate to empty ranges; use '10 downTo 1'.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#invalidrange
  # ─────────────────────────────────────────────────────────────────────────────
  InvalidRange:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: IteratorHasNextCallsNextMethod
  # ELI5: Catches broken custom Iterator implementations where hasNext() accidentally calls next().
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#iteratorhasnextcallsnextmethod
  # ─────────────────────────────────────────────────────────────────────────────
  IteratorHasNextCallsNextMethod:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: IteratorNotThrowingNoSuchElementException
  # ELI5: Ensures next() on custom iterators throws NoSuchElementException when exhausted.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#iteratornotthrowingnosuchelementexception
  # ─────────────────────────────────────────────────────────────────────────────
  IteratorNotThrowingNoSuchElementException:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: LateinitUsage
  # ELI5: Flags 'lateinit var' usage; prefer constructor injection or nullable types.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#lateinitusage
  # ─────────────────────────────────────────────────────────────────────────────
  LateinitUsage:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    ignoreOnClassesPattern: ''
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: MapGetWithNotNullAssertionOperator
  # ELI5: Forbids 'map[key]!!'; use 'map.getValue(key)' or handle nulls safely with '?:'.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#mapgetwithnotnullassertionoperator
  # ─────────────────────────────────────────────────────────────────────────────
  MapGetWithNotNullAssertionOperator:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: MissingPackageDeclaration
  # ELI5: Requires every source file to declare a 'package ...' statement at the top.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#missingpackagedeclaration
  # ─────────────────────────────────────────────────────────────────────────────
  MissingPackageDeclaration:
    active: false
    excludes: ['**/*.kts']
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: NullCheckOnMutableProperty
  # ELI5: Warns about null checks on mutable properties that another thread could mutate between check and use.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#nullcheckonmutableproperty
  # ─────────────────────────────────────────────────────────────────────────────
  NullCheckOnMutableProperty:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: NullableToStringCall
  # ELI5: Catches 'x.toString()' where x is nullable, which prints the literal string 'null' instead of handling it.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#nullabletostringcall
  # ─────────────────────────────────────────────────────────────────────────────
  NullableToStringCall:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: PropertyUsedBeforeDeclaration
  # ELI5: Flags accessing a property in an init block before its declaration line has run.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#propertyusedbeforedeclaration
  # ─────────────────────────────────────────────────────────────────────────────
  PropertyUsedBeforeDeclaration:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnconditionalJumpStatementInLoop
  # ELI5: Flags loops that always break or return on the very first iteration.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unconditionaljumpstatementinloop
  # ─────────────────────────────────────────────────────────────────────────────
  UnconditionalJumpStatementInLoop:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnnecessaryNotNullCheck
  # ELI5: Flags null checks on variables that the compiler knows can never be null.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unnecessarynotnullcheck
  # ─────────────────────────────────────────────────────────────────────────────
  UnnecessaryNotNullCheck:
    active: false
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnnecessaryNotNullOperator
  # ELI5: Flags using '!!' on a variable that cannot be null, or forbids '!!' outright.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unnecessarynotnulloperator
  # ─────────────────────────────────────────────────────────────────────────────
  UnnecessaryNotNullOperator:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnnecessarySafeCall
  # ELI5: Flags using '?.' on a non-nullable expression where normal '.' should be used.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unnecessarysafecall
  # ─────────────────────────────────────────────────────────────────────────────
  UnnecessarySafeCall:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnreachableCatchBlock
  # ELI5: Flags catch blocks that can never be reached because a broader exception was already caught above.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unreachablecatchblock
  # ─────────────────────────────────────────────────────────────────────────────
  UnreachableCatchBlock:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnreachableCode
  # ELI5: Flags dead code after returns, throws, or unconditional breaks.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unreachablecode
  # ─────────────────────────────────────────────────────────────────────────────
  UnreachableCode:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnsafeCallOnNullableType
  # ELI5: Flags unsafe calls on nullable types without proper safe-call or null check.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unsafecallonnullabletype
  # ─────────────────────────────────────────────────────────────────────────────
  UnsafeCallOnNullableType:
    active: true
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UnsafeCast
  # ELI5: Flags unsafe 'as' casts; use safe 'as?' with Elvis operator or 'is' type checks instead.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#unsafecast
  # ─────────────────────────────────────────────────────────────────────────────
  UnsafeCast:
    active: true
  UnusedUnaryOperator:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: UselessPostfixExpression
  # ELI5: Flags postfix increments like 'x++' whose result is never actually used.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#uselesspostfixexpression
  # ─────────────────────────────────────────────────────────────────────────────
  UselessPostfixExpression:
    active: true
  # ─────────────────────────────────────────────────────────────────────────────
  # Rule: WrongEqualsTypeParameter
  # ELI5: Catches accidental method signatures like 'fun equals(other: Foo)' instead of overriding 'equals(other: Any?)'.
  # Type: Boolean
  # Docs: https://detekt.dev/docs/rules/potential-bugs#wrongequalstypeparameter
  # ─────────────────────────────────────────────────────────────────────────────
  WrongEqualsTypeParameter:
    active: true

