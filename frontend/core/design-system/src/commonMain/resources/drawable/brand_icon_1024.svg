<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F5597" />
      <stop offset="100%" stop-color="#1B365D" />
    </linearGradient>

    <linearGradient id="rightWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="keelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full bleed background for iOS / Android Legacy -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />

  <!-- Orbital Compass / Radar Tracking Arc -->
  <path d="M 240 680 A 320 320 0 1 1 780 440" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-opacity="0.4" 
        stroke-width="10" 
        stroke-dasharray="32 20" 
        stroke-linecap="round" />
        
  <path d="M 300 620 A 220 220 0 0 1 680 440" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-opacity="0.15" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- The Delta Glider Motif -->
  <g filter="url(#softShadow)">
    <polygon points="624,344 416,664 472,624" fill="url(#keelGrad)" />
    <polygon points="624,344 272,544 472,624" fill="#FFFFFF" />
    <polygon points="624,344 472,624 688,560" fill="url(#rightWingGrad)" />
  </g>

  <!-- 4-Point AI Spark -->
  <path d="M 736 192 
           C 736 232 752 256 792 256 
           C 752 256 736 280 736 320 
           C 736 280 720 256 680 256 
           C 720 256 736 232 736 192 Z" 
        fill="url(#sparkGrad)" />

  <circle cx="792" cy="336" r="8" fill="#FCD34D" opacity="0.8" />
</svg>
