[tools]
# Pinned to match .github/workflows/ci.yml. The tracker scripts own the only
# copy of the application record, so the interpreter is not allowed to drift.
python = "3.15.2"
bun = "latest"
usage = { version = "7.1.4", workflow = "publish-cli.yml" }

[env]
_ = { file = ".env.local" }

# ── Tasks ──────────────────────────────────────────────────────────────────
# Shorthand: mise run <name>  (or just `mise <name>` when no conflict)

[tasks.tui]
description = "Open the terminal job-tracker dashboard (use keyboard shortcuts)"
run = ".venv/bin/python ui/terminal/tracker_tui.py"

[tasks.tracker]
description = "Run the tracker CLI (subcommands: check, seed, list, get, add, upsert, status, score, event, artifact, backfill, bulk, import, export, sheet, proposals, collect, labels, sync-due, mock-clear)"
usage = '''
cmd "check" help="Validate contract and connection" {
  flag "--offline" help="Skip the Firestore reachability probe"
}
cmd "seed" help="Write meta/schema from the contract"
cmd "list" help="List applications" {
  flag "--status " help="Filter by status"
  flag "--open" help="Only open applications"
  flag "--tag " help="Filter by an exact tag value"
  flag "--limit " help="Max results to return"
  flag "--json" help="Output as JSON"
  flag "--tui" help="Launch interactive TUI with these filters"
}
cmd "get" help="Show one application and its events" {
  arg "id" help="Application ID"
}
cmd "add" help="Create an application from a JSON payload" {
  flag "--json " help="Payload file, or - for stdin"
  flag "--dry-run" help="Resolve and validate only"
}
cmd "upsert" help="Create-or-merge from a JSON payload" {
  flag "--json " help="Payload file, or - for stdin"
  flag "--dry-run" help="Resolve and validate only"
}
cmd "status" help="Record a funnel status change" {
  arg "id" help="Application ID"
  arg "status" help="Target status"
  flag "--date " help="ISO date the change happened"
  flag "--note " help="What happened"
  flag "--correction" help="Emit status-corrected event"
  flag "--dry-run" help="Preview without writing"
}
cmd "score" help="Record a recalculated fit rating" {
  arg "id" help="Application ID"
  flag "--fit " help="Integer 0-100"
  flag "--date " help="ISO date the score was decided"
  flag "--note " help="What changed in the evaluation"
  flag "--dry-run" help="Preview without writing"
}
cmd "event" help="Append a timeline event" {
  arg "id" help="Application ID"
  flag "--type " help="Event type (e.g. event:interview)"
  flag "--date " help="ISO date the event happened"
  flag "--note " help="Event note"
  flag "--json " help="Extra fields as JSON"
  flag "--dry-run" help="Preview without writing"
}
cmd "artifact" help="Register and upload a file" {
  arg "id" help="Application ID"
  flag "--kind " help="Artifact type (e.g. artifact:cv)"
  flag "--path " help="Local file path"
  flag "--filename " help="Override stored filename"
  flag "--no-upload" help="Record the path only"
  flag "--dry-run" help="Preview without writing"
}
cmd "backfill" help="Add hashes and storage to registered artifacts" {
  flag "--apply" help="Write the updates (default: report only)"
  flag "--root " help="Repo root for relative paths"
  flag "--limit " help="Stop after N files"
}
cmd "bulk" help="Add many applications from one JSON file" {
  flag "--json " help="JSON array or {applications: [...]}"
  flag "--allow-partial" help="Write the valid rows"
  flag "--dry-run" help="Preview without writing"
}
cmd "import" help="One-shot import of the legacy CSV" {
  flag "--csv " help="Path to legacy tracker CSV"
  flag "--dry-run" help="Report only, never write"
  flag "--mock" help="Skip historical profile reconciliation"
  flag "--report " help="Write the reconciliation report"
}
cmd "export" help="Read the record back out" {
  flag "--json" help="Full JSON payload"
  flag "--csv" help="Legacy CSV shape"
  flag "--ndjson" help="One application per line"
  flag "-o --output " help="Write to a file instead of stdout"
  flag "--refresh-cache" help="Also refresh tracker-cache.json"
}
cmd "sheet" help="Regenerate the Sheets view" {
  flag "--sync" help="Accepted for symmetry"
  flag "--sheet-id " help="Spreadsheet ID"
  flag "--local-only" help="Write CSVs locally"
  flag "--directory " help="Where --local-only writes"
}
cmd "proposals" help="Review the collector queue" {
  cmd "list" help="List proposals" {
    flag "--state " help="Filter by state (e.g. proposal:pending)"
  }
  cmd "show" help="Show a proposal" {
    arg "id" help="Proposal ID"
  }
  cmd "approve" help="Approve a proposal" {
    arg "id" help="Proposal ID"
    flag "--note " help="Resolution text"
    flag "--only " help="Comma-separated change indexes to approve"
  }
  cmd "reject" help="Reject a proposal" {
    arg "id" help="Proposal ID"
    flag "--reason " help="Why it was rejected"
  }
  cmd "expire" help="Expire stale proposals"
}
cmd "collect" help="Stage proposals from fetched messages" {
  flag "--json " help="Inbox payload path"
  flag "--labels " help="JSON inventory of Gmail labels"
  flag "--trigger " help="Trigger source: manual | cron | application-updated"
  flag "--dry-run" help="Preview without writing"
}
cmd "labels" help="Show Gmail labels seen at the last sync"
cmd "sync-due" help="Run due sync-requests" {
  flag "--json " help="Inbox payload for every request"
  flag "--dry-run" help="List what is due"
}
cmd "mock-clear" help="Delete namespaced mock records" {
  flag "--apply" help="Actually delete (default: dry run)"
}
'''
run = '''.venv/bin/python scripts/tracker.py {{ usage.cmd }}{% if usage.offline %} --offline{% endif %}{% if usage.status %} --status {{ usage.status }}{% endif %}{% if usage.open %} --open{% endif %}{% if usage.tag %} --tag {{ usage.tag }}{% endif %}{% if usage.limit %} --limit {{ usage.limit }}{% endif %}{% if usage.json %} --json{% if usage.cmd == "add" or usage.cmd == "upsert" or usage.cmd == "bulk" or usage.cmd == "event" %} {{ usage.json }}{% endif %}{% endif %}{% if usage.dry_run %} --dry-run{% endif %}{% if usage.tui %} --tui{% endif %}{% if usage.id %} {{ usage.id }}{% endif %}{% if usage.fit %} --fit {{ usage.fit }}{% endif %}{% if usage.date %} --date {{ usage.date }}{% endif %}{% if usage.note %} --note {{ usage.note }}{% endif %}{% if usage.correction %} --correction{% endif %}{% if usage.type %} --type {{ usage.type }}{% endif %}{% if usage.kind %} --kind {{ usage.kind }}{% endif %}{% if usage.path %} --path {{ usage.path }}{% endif %}{% if usage.filename %} --filename {{ usage.filename }}{% endif %}{% if usage.no_upload %} --no-upload{% endif %}{% if usage.apply %} --apply{% endif %}{% if usage.root %} --root {{ usage.root }}{% endif %}{% if usage.allow_partial %} --allow-partial{% endif %}{% if usage.csv %} --csv{% if usage.cmd == "import" %} {{ usage.csv }}{% endif %}{% endif %}{% if usage.mock %} --mock{% endif %}{% if usage.report %} --report {{ usage.report }}{% endif %}{% if usage.ndjson %} --ndjson{% endif %}{% if usage.output %} -o {{ usage.output }}{% endif %}{% if usage.refresh_cache %} --refresh-cache{% endif %}{% if usage.sheet_id %} --sheet-id {{ usage.sheet_id }}{% endif %}{% if usage.local_only %} --local-only{% endif %}{% if usage.directory %} --directory {{ usage.directory }}{% endif %}{% if usage.sync %} --sync{% endif %}{% if usage.labels %} --labels {{ usage.labels }}{% endif %}{% if usage.trigger %} --trigger {{ usage.trigger }}{% endif %}{% if usage.state %} --state {{ usage.state }}{% endif %}{% if usage.reason %} --reason {{ usage.reason }}{% endif %}{% if usage.only %} --only {{ usage.only }}{% endif %}'''

[tasks.report]
description = "Generate the HTML applications report"
run = ".venv/bin/python scripts/generate_report.py"

[tasks.setup]
description = "Run first-time setup (validate environment, seed schema, inject mock records)"
usage = '''
flag "--check" help="Show readiness report without writing"
flag "--sheet" help="Sync the Google Sheet after mock injection"
flag "--count " help="Number of synthetic applications to create"
'''
run = '''.venv/bin/python scripts/setup.py{% if usage.check %} --check{% endif %}{% if usage.sheet %} --sheet{% endif %}{% if usage.count %} --count {{ usage.count }}{% endif %}'''

[tasks.salary]
description = "Look up salary benchmark data"
usage = '''
arg "[company]" help="Company name to search for"
flag "--city " help="Filter by city name"
flag "--json" help="Output as JSON"
flag "--list-all" help="List all companies"
flag "--validate" help="Validate salary_data.json and print a report"
'''
run = '''.venv/bin/python scripts/salary_lookup.py{% if usage.company %} {{ usage.company }}{% endif %}{% if usage.city %} --city {{ usage.city }}{% endif %}{% if usage.json %} --json{% endif %}{% if usage.list_all %} --list-all{% endif %}{% if usage.validate %} --validate{% endif %}'''

# ── Gmail sync ─────────────────────────────────────────────────────────────
# Each step is independent so a scheduler or agent can run only what it needs.

[tasks."gmail:sync:labels"]
description = "Fetch and cache Gmail JOB labels (dry-run by default)"
usage = '''
flag "-v --verbose" help="Print detailed progress and timing to stderr"
flag "--label " help="Fetch only this label (validated against Gmail labels)"
flag "--since " help="Lookback start date, YYYY-MM-DD"
flag "--timeout " help="Timeout in seconds per Composio API call (default: 60)"
'''
run = '''.venv/bin/python scripts/gmail_fetch.py --dry-run{% if usage.verbose %} -v{% endif %}{% if usage.label %} --label {{ usage.label }}{% endif %}{% if usage.since %} --since {{ usage.since }}{% endif %}{% if usage.timeout %} --timeout {{ usage.timeout }}{% endif %}'''

[tasks."gmail:read:inbox"]
description = "Fetch job-related emails from Gmail and write inbox payload"
usage = '''
flag "-v --verbose" help="Print detailed progress and timing to stderr"
flag "--label " help="Fetch only this label (validated against Gmail labels)"
flag "--since " help="Lookback start date, YYYY-MM-DD"
flag "--max " help="Total messages to collect, fetched 50 at a time"
flag "--timeout " help="Timeout in seconds per Composio API call (default: 60)"
flag "--dry-run" help="Read Gmail and compare labels, but write nothing"
'''
run = '''.venv/bin/python scripts/gmail_fetch.py{% if usage.verbose %} -v{% endif %}{% if usage.label %} --label {{ usage.label }}{% endif %}{% if usage.since %} --since {{ usage.since }}{% endif %}{% if usage.max %} --max {{ usage.max }}{% endif %}{% if usage.timeout %} --timeout {{ usage.timeout }}{% endif %}{% if usage.dry_run %} --dry-run{% endif %}'''

[tasks."gmail:collect"]
description = "Stage proposals from fetched emails to Firestore (set TRACKER_ALLOW_WRITES=1)"
usage = '''
flag "--json " help="Inbox payload path (default: generated/gmail-inbox.json)"
flag "--labels " help="JSON inventory of Gmail labels discovered by this fetch"
flag "--trigger " help="Trigger source: manual | cron | application-updated"
flag "--dry-run" help="Preview without writing to Firestore"
'''
run = '''.venv/bin/python scripts/tracker.py collect{% if usage.json %} --json {{ usage.json }}{% endif %}{% if usage.labels %} --labels {{ usage.labels }}{% endif %}{% if usage.trigger %} --trigger {{ usage.trigger }}{% endif %}{% if usage.dry_run %} --dry-run{% endif %}'''

[tasks.migrate-gcs]
description = "Upload local artifacts to GCS and backfill Firestore (set TRACKER_ALLOW_WRITES=1)"
usage = '''
flag "--dry-run" help="Show tree view without uploading"
flag "--company " help="Only process artifacts for this company (case-insensitive)"
flag "--documents " help="Path to documents/applications/ directory"
'''
run = '''.venv/bin/python scripts/migrate_gcs.py{% if usage.dry_run %} --dry-run{% endif %}{% if usage.company %} --company {{ usage.company }}{% endif %}{% if usage.documents %} --documents {{ usage.documents }}{% endif %}'''

[tasks.purge-gcs-legacy]
description = "Purge old-style GCS artifacts and migrate orphans (set TRACKER_ALLOW_WRITES=1)"
usage = '''flag "--dry-run" help="Preview what would be done without making changes"'''
run = '''.venv/bin/python scripts/purge_gcs_legacy.py{% if usage.dry_run %} --dry-run{% endif %}'''

[tasks."mise:docs:tasks"]
description = "Regenerates docs/mise"
sources = ["mise.toml"]
shell = "zsh -c"
run = "mise generate task-docs -m -o ./docs/mise"
