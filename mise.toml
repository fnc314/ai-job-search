monorepo_root = true

[tools]
  # Pinned to match .github/workflows/ci.yml. The tracker scripts own the only
  # copy of the application record, so the interpreter is not allowed to drift.
  python = "3.15.2"
  bun = "1.4.4"
  usage = { version = "7.2.0", workflow = "publish-cli.yml" }
  gradle = "9.8.2"
  java = "26.0.2+101"

[env]
  _ = { file = ".env.local" }
  # TUI log cleanup settings (used by the `cd` hook)
  TUI_LOG_RETENTION_DAYS = "7"                                                          # Days to keep TUI log directories (0 = always clean)
  TUI_LOG_COOLDOWN_HOURS = "24"                                                         # Hours between cleanup prompts
  ANDROID_USER_HOME = "/Users/fnc314/.android"
  ANDROID_HOME = "/Users/fnc314/.android/sdk"
  JAVA_HOME = "/Users/fnc314/.local/share/mise/installs/java/26.0.2+101/Contents/Home"

[tasks]
  # ── Tasks ──────────────────────────────────────────────────────────────────
  # Shorthand: mise run <name>  (or just `mise <name>` when no conflict)
  tui = { description = "Open the terminal job-tracker dashboard (use keyboard shortcuts)", env = { TRACKER_SOURCE = "store" }, run = ".venv/bin/python ui/terminal/tracker_tui.py" }
  tracker = {
    description = "Run the tracker CLI (subcommands: check, seed, list, get, add, upsert, lead, status, score, event, artifact, backfill, bulk, import, export, sheet, proposals, collect, labels, sync-due, mock-clear)",
    raw = true,
    usage = """
cmd "check" help="Validate contract and connection" {
  flag "--offline" help="Skip the Firestore reachability probe"
}
cmd "seed" help="Write meta/schema from the contract"
cmd "list" help="List applications" {
  flag "--status <status>" help="Filter by status"
  flag "--open" help="Only open applications"
  flag "--tag <tag>" help="Filter by an exact tag value"
  flag "--limit <limit>" help="Max results to return"
  flag "--json" help="Output as JSON"
  flag "--tui" help="Launch interactive TUI with these filters"
}
cmd "get" help="Show one application and its events" {
  arg "id" help="Application ID"
}
cmd "add" help="Create an application from a JSON payload" {
  flag "--json <file>" help="Payload file, or - for stdin"
  flag "-i --interactive" help="Prompt for fields interactively"
  flag "--dry-run" help="Resolve and validate only"
}
cmd "upsert" help="Create-or-merge from a JSON payload" {
  flag "--json <file>" help="Payload file, or - for stdin"
  flag "--dry-run" help="Resolve and validate only"
}
cmd "lead" help="Record a recruiter outreach lead" {
  flag "-c --company <company>" help="Company name (required)"
  flag "--channel <channel>" help="Channel value (default: outreach:linkedin)"
  flag "-r --contact <contact>" help="Recruiter or contact name"
  flag "-n --note <note>" var=#true help="Context about the outreach (repeatable)"
  flag "-t --tag <tag>" var=#true help="Additional tags (repeatable)"
  flag "--dry-run" help="Resolve and validate only"
}
cmd "status" help="Record a funnel status change" {
  arg "id" help="Application ID"
  arg "status" help="Target status"
  flag "--date <date>" help="ISO date the change happened"
  flag "--note <note>" help="What happened"
  flag "--correction" help="Emit status-corrected event"
  flag "--dry-run" help="Preview without writing"
}
cmd "score" help="Record a recalculated fit rating" {
  arg "id" help="Application ID"
  flag "--fit <fit>" help="Integer 0-100"
  flag "--date <date>" help="ISO date the score was decided"
  flag "--note <note>" help="What changed in the evaluation"
  flag "--dry-run" help="Preview without writing"
}
cmd "event" help="Append a timeline event" {
  arg "id" help="Application ID"
  flag "--type <type>" help="Event type (e.g. event:interview)"
  flag "--date <date>" help="ISO date the event happened"
  flag "--note <note>" help="Event note"
  flag "--json <json>" help="Extra fields as JSON"
  flag "--dry-run" help="Preview without writing"
}
cmd "artifact" help="Register and upload a file" {
  arg "id" help="Application ID"
  flag "--kind <kind>" help="Artifact type (e.g. artifact:cv)"
  flag "--path <path>" help="Local file path"
  flag "--filename <filename>" help="Override stored filename"
  flag "--no-upload" help="Record the path only"
  flag "--dry-run" help="Preview without writing"
}
cmd "backfill" help="Add hashes and storage to registered artifacts" {
  flag "--apply" help="Write the updates (default: report only)"
  flag "--root <root>" help="Repo root for relative paths"
  flag "--limit <limit>" help="Stop after N files"
}
cmd "bulk" help="Add many applications from one JSON file" {
  flag "--json <file>" help="JSON array or {applications: [...]}"
  flag "--allow-partial" help="Write the valid rows"
  flag "--dry-run" help="Preview without writing"
}
cmd "import" help="One-shot import of the legacy CSV" {
  flag "--csv <csv>" help="Path to legacy tracker CSV"
  flag "--dry-run" help="Report only, never write"
  flag "--mock" help="Skip historical profile reconciliation"
  flag "--report <report>" help="Write the reconciliation report"
}
cmd "export" help="Read the record back out" {
  flag "--json" help="Full JSON payload"
  flag "--csv" help="Legacy CSV shape"
  flag "--ndjson" help="One application per line"
  flag "-o --output <output>" help="Write to a file instead of stdout"
  flag "--refresh-cache" help="Also refresh tracker-cache.json"
}
cmd "sheet" help="Regenerate the Sheets view" {
  flag "--sync" help="Accepted for symmetry"
  flag "--sheet-id <sheet_id>" help="Spreadsheet ID"
  flag "--local-only" help="Write CSVs locally"
  flag "--directory <directory>" help="Where --local-only writes"
}
cmd "proposals" help="Review the collector queue" {
  cmd "list" help="List proposals" {
    flag "--state <state>" help="Filter by state (e.g. proposal:pending)"
  }
  cmd "show" help="Show a proposal" {
    arg "id" help="Proposal ID"
  }
  cmd "approve" help="Approve a proposal" {
    arg "[id]" help="Proposal ID (optional with -i)"
    flag "-i --interactive" help="Iterate through all pending proposals interactively"
    flag "--note <note>" help="Resolution text"
    flag "--only <only>" help="Comma-separated change indexes to approve"
  }
  cmd "reject" help="Reject a proposal" {
    arg "id" help="Proposal ID"
    flag "--reason <reason>" help="Why it was rejected"
  }
  cmd "expire" help="Expire stale proposals"
}
cmd "collect" help="Stage proposals from fetched messages" {
  flag "--json <json>" help="Inbox payload path"
  flag "--labels <labels>" help="JSON inventory of Gmail labels"
  flag "--trigger <trigger>" help="Trigger source: manual | cron | application-updated"
  flag "--dry-run" help="Preview without writing"
}
cmd "labels" help="Show Gmail labels seen at the last sync"
cmd "sync-due" help="Run due sync-requests" {
  flag "--json <json>" help="Inbox payload for every request"
  flag "--dry-run" help="List what is due"
}
cmd "mock-clear" help="Delete namespaced mock records" {
  flag "--apply" help="Actually delete (default: dry run)"
}
cmd "edit" help="Modify fields of an existing application record" {
  arg "[id]" help="Application ID or UUID to edit"
  flag "--app-id <app_id>" help="Application ID or UUID to edit"
  flag "-i --interactive" help="Interactively select record and edit fields"
  flag "--dry-run" help="Preview changes without writing"
  flag "--job-url <job_url>" help="Job posting URL"
  flag "--job-application-url <job_application_url>" help="Job application portal URL"
  flag "--company <company>" help="Company name"
  flag "--role <role>" help="Role title"
  flag "--status <status>" help="Target status"
  flag "--date <date>" help="Application date"
  flag "--contact-person <contact_person>" help="Contact person"
  flag "--contact-email <contact_email>" help="Contact email"
  flag "--fit-rating <fit_rating>" help="Fit rating"
  flag "--note <note>" help="Audit note"
  arg "[args]..." var=#true help="Extra field arguments"
}
cmd "align" help="Align applications in Firebase to canonical IDs, recalculate fit, and update outcome.md" {
  arg "[id]" help="Application ID or UUID to align"
  flag "--app-id <app_id>" help="Application ID or UUID to align"
  flag "--all" help="Scan and align all applications"
  flag "--dry-run" help="Preview changes without writing"
  flag "--no-fit-recalc" help="Skip recalculating fit"
  flag "--no-docs-update" help="Skip updating outcome.md"
  flag "--note <note>" help="Optional audit note"
}
""",
    run = '.venv/bin/python scripts/tracker.py {{ usage.cmd }}{% if usage.interactive %} --interactive{% endif %}{% if usage.offline %} --offline{% endif %}{% if usage.status %} --status "{{ usage.status }}"{% endif %}{% if usage.open %} --open{% endif %}{% if usage.tag %}{% if usage.tag is string %} --tag "{{ usage.tag }}"{% else %}{% for t in usage.tag %} --tag "{{ t }}"{% endfor %}{% endif %}{% endif %}{% if usage.limit %} --limit "{{ usage.limit }}"{% endif %}{% if usage.json %} --json{% if usage.cmd == "add" or usage.cmd == "upsert" or usage.cmd == "bulk" or usage.cmd == "event" %} "{{ usage.json }}"{% endif %}{% endif %}{% if usage.dry_run %} --dry-run{% endif %}{% if usage.all %} --all{% endif %}{% if usage.no_fit_recalc %} --no-fit-recalc{% endif %}{% if usage.no_docs_update %} --no-docs-update{% endif %}{% if usage.tui %} --tui{% endif %}{% if usage.id %} "{{ usage.id }}"{% endif %}{% if usage.app_id %} --app-id "{{ usage.app_id }}"{% endif %}{% if usage.job_url %} --job-url "{{ usage.job_url }}"{% endif %}{% if usage.job_application_url %} --job-application-url "{{ usage.job_application_url }}"{% endif %}{% if usage.contact_person %} --contact-person "{{ usage.contact_person }}"{% endif %}{% if usage.contact_email %} --contact-email "{{ usage.contact_email }}"{% endif %}{% if usage.fit_rating %} --fit-rating "{{ usage.fit_rating }}"{% endif %}{% if usage.fit %} --fit "{{ usage.fit }}"{% endif %}{% if usage.date %} --date "{{ usage.date }}"{% endif %}{% if usage.note %}{% if usage.note is string %} --note "{{ usage.note }}"{% else %}{% for n in usage.note %} --note "{{ n }}"{% endfor %}{% endif %}{% endif %}{% if usage.correction %} --correction{% endif %}{% if usage.type %} --type "{{ usage.type }}"{% endif %}{% if usage.kind %} --kind "{{ usage.kind }}"{% endif %}{% if usage.path %} --path "{{ usage.path }}"{% endif %}{% if usage.filename %} --filename "{{ usage.filename }}"{% endif %}{% if usage.no_upload %} --no-upload{% endif %}{% if usage.apply %} --apply{% endif %}{% if usage.root %} --root "{{ usage.root }}"{% endif %}{% if usage.allow_partial %} --allow-partial{% endif %}{% if usage.csv %} --csv{% if usage.cmd == "import" %} "{{ usage.csv }}"{% endif %}{% endif %}{% if usage.mock %} --mock{% endif %}{% if usage.report %} --report "{{ usage.report }}"{% endif %}{% if usage.ndjson %} --ndjson{% endif %}{% if usage.output %} -o "{{ usage.output }}"{% endif %}{% if usage.refresh_cache %} --refresh-cache{% endif %}{% if usage.sheet_id %} --sheet-id "{{ usage.sheet_id }}"{% endif %}{% if usage.local_only %} --local-only{% endif %}{% if usage.directory %} --directory "{{ usage.directory }}"{% endif %}{% if usage.sync %} --sync{% endif %}{% if usage.labels %} --labels "{{ usage.labels }}"{% endif %}{% if usage.trigger %} --trigger "{{ usage.trigger }}"{% endif %}{% if usage.state %} --state "{{ usage.state }}"{% endif %}{% if usage.reason %} --reason "{{ usage.reason }}"{% endif %}{% if usage.only %} --only "{{ usage.only }}"{% endif %}{% if usage.company %} --company "{{ usage.company }}"{% endif %}{% if usage.channel %} --channel "{{ usage.channel }}"{% endif %}{% if usage.contact %} --contact "{{ usage.contact }}"{% endif %}{% if usage.args %}{% for a in usage.args %} "{{ a }}"{% endfor %}{% endif %}'
  }
  align = {
    description = "Align application records in Firebase to canonical IDs, recalculate fit, and update outcome.md",
    usage = """
arg "[id]" help="Application ID or UUID to align"
flag "--app-id <app_id>" help="Application ID or UUID to align"
flag "--all" help="Scan and align all applications"
flag "--dry-run" help="Preview changes without writing"
flag "--no-fit-recalc" help="Skip recalculating fit"
flag "--no-docs-update" help="Skip updating outcome.md"
flag "--note <note>" help="Optional audit note"
""",
    run = '.venv/bin/python scripts/tracker.py align{% if usage.id %} "{{ usage.id }}"{% endif %}{% if usage.app_id %} --app-id "{{ usage.app_id }}"{% endif %}{% if usage.all %} --all{% endif %}{% if usage.dry_run %} --dry-run{% endif %}{% if usage.no_fit_recalc %} --no-fit-recalc{% endif %}{% if usage.no_docs_update %} --no-docs-update{% endif %}{% if usage.note %} --note "{{ usage.note }}"{% endif %}'
  }
  report = { description = "Generate the HTML applications report", run = ".venv/bin/python scripts/generate_report.py" }
  dashboard = {
    description = "Serve and preview the web dashboard on localhost",
    usage = """
flag "-p --port <port>" help="Port to listen on (default: 8000)"
flag "-b --host <host>" help="Host address to bind to (default: 127.0.0.1)"
flag "-r --regenerate" help="Regenerate dashboard HTML from tracker before starting"
flag "--no-browser" help="Do not automatically open the browser"
""",
    run = ".venv/bin/python ui/web/application-dashboard-server.py{% if usage.port %} -p {{ usage.port }}{% endif %}{% if usage.host %} -b {{ usage.host }}{% endif %}{% if usage.regenerate %} -r{% endif %}{% if usage.no_browser %} --no-browser{% endif %}"
  }
  setup = {
    description = "Run first-time setup (validate environment, seed schema, inject mock records)",
    usage = """
flag "--check" help="Show readiness report without writing"
flag "--sheet" help="Sync the Google Sheet after mock injection"
flag "--count <count>" help="Number of synthetic applications to create"
""",
    run = ".venv/bin/python scripts/setup.py{% if usage.check %} --check{% endif %}{% if usage.sheet %} --sheet{% endif %}{% if usage.count %} --count {{ usage.count }}{% endif %}"
  }
  salary = {
    description = "Look up salary benchmark data",
    usage = """
arg "[company]" help="Company name to search for"
flag "--city <city>" help="Filter by city name"
flag "--json" help="Output as JSON"
flag "--list-all" help="List all companies"
flag "--validate" help="Validate salary_data.json and print a report"
""",
    run = ".venv/bin/python scripts/salary_lookup.py{% if usage.company %} {{ usage.company }}{% endif %}{% if usage.city %} --city {{ usage.city }}{% endif %}{% if usage.json %} --json{% endif %}{% if usage.list_all %} --list-all{% endif %}{% if usage.validate %} --validate{% endif %}"
  }
  scrape = {
    description = "Search job portals and collect new listings, deduplicated against seen jobs and the tracker",
    raw = true,
    usage = """
flag "-q --query" help="Explicit query (repeatable); overrides search-queries.md"
flag "--limit <limit>" help="Max results per portal per query (default: 20)"
flag "--priority <priority>" help="Priority categories to run, 0 = all (default: 3)"
flag "--focus <focus>" help="Focus area to prioritize queries (e.g. Android)"
flag "--save-seen" help="Write updated seen postings to Firestore after search"
flag "--migrate-seen" help="Seed existing seen_jobs.json into Firestore, then exit"
flag "--table" help="Output as a Markdown table instead of JSON"
flag "--summary" help="Only show summary stats, not individual results"
flag "--health" help="Only check portal health (probe each portal)"
""",
    run = '.venv/bin/python scripts/scrape.py{% if usage.query %}{% for q in usage.query %} -q "{{ q }}"{% endfor %}{% endif %}{% if usage.limit %} --limit {{ usage.limit }}{% endif %}{% if usage.priority %} --priority {{ usage.priority }}{% endif %}{% if usage.focus %} --focus "{{ usage.focus }}"{% endif %}{% if usage.save_seen %} --save-seen{% endif %}{% if usage.migrate_seen %} --migrate-seen{% endif %}{% if usage.table %} --table{% endif %}{% if usage.summary %} --summary{% endif %}{% if usage.health %} --health{% endif %}'
  }
  "scrape:migrate" = {
    description = "One-time migration: seed existing seen_jobs.json into Firestore",
    run = ".venv/bin/python scripts/scrape.py --migrate-seen"
  }
  # ── Gmail sync ─────────────────────────────────────────────────────────────
  # Each step is independent so a scheduler or agent can run only what it needs.
  "gmail:sync:labels" = {
    description = "Fetch and cache Gmail JOB labels (dry-run by default)",
    usage = """
flag "-v --verbose" help="Print detailed progress and timing to stderr"
flag "--label <label>" help="Fetch only this label (validated against Gmail labels)"
flag "--since <since>" help="Lookback start date, YYYY-MM-DD"
flag "--timeout <timeout>" help="Timeout in seconds per Composio API call (default: 60)"
""",
    run = ".venv/bin/python scripts/gmail_fetch.py --dry-run{% if usage.verbose %} -v{% endif %}{% if usage.label %} --label {{ usage.label }}{% endif %}{% if usage.since %} --since {{ usage.since }}{% endif %}{% if usage.timeout %} --timeout {{ usage.timeout }}{% endif %}"
  }
  "gmail:read:inbox" = {
    description = "Fetch job-related emails from Gmail and write inbox payload",
    usage = """
flag "-v --verbose" help="Print detailed progress and timing to stderr"
flag "--label <label>" help="Fetch only this label (validated against Gmail labels)"
flag "--since <since>" help="Lookback start date, YYYY-MM-DD"
flag "--max <max>" help="Total messages to collect, fetched 50 at a time"
flag "--timeout <timeout>" help="Timeout in seconds per Composio API call (default: 60)"
flag "--dry-run" help="Read Gmail and compare labels, but write nothing"
""",
    run = ".venv/bin/python scripts/gmail_fetch.py{% if usage.verbose %} -v{% endif %}{% if usage.label %} --label {{ usage.label }}{% endif %}{% if usage.since %} --since {{ usage.since }}{% endif %}{% if usage.max %} --max {{ usage.max }}{% endif %}{% if usage.timeout %} --timeout {{ usage.timeout }}{% endif %}{% if usage.dry_run %} --dry-run{% endif %}"
  }
  "gmail:collect" = {
    description = "Stage proposals from fetched emails to Firestore (set TRACKER_ALLOW_WRITES=1)",
    usage = """
flag "--json <json>" help="Inbox payload path (default: generated/gmail-inbox.json)"
flag "--labels <labels>" help="JSON inventory of Gmail labels discovered by this fetch"
flag "--trigger <trigger>" help="Trigger source: manual | cron | application-updated"
flag "--dry-run" help="Preview without writing to Firestore"
""",
    run = ".venv/bin/python scripts/tracker.py collect{% if usage.json %} --json {{ usage.json }}{% endif %}{% if usage.labels %} --labels {{ usage.labels }}{% endif %}{% if usage.trigger %} --trigger {{ usage.trigger }}{% endif %}{% if usage.dry_run %} --dry-run{% endif %}"
  }
  migrate-gcs = {
    description = "Upload local artifacts to GCS and backfill Firestore (set TRACKER_ALLOW_WRITES=1)",
    usage = """
flag "--dry-run" help="Show tree view without uploading"
flag "--company <company>" help="Only process artifacts for this company (case-insensitive)"
flag "--documents <documents>" help="Path to job-applications/ directory"
""",
    run = ".venv/bin/python scripts/migrate_gcs.py{% if usage.dry_run %} --dry-run{% endif %}{% if usage.company %} --company {{ usage.company }}{% endif %}{% if usage.documents %} --documents {{ usage.documents }}{% endif %}"
  }
  purge-gcs-legacy = { description = "Purge old-style GCS artifacts and migrate orphans (set TRACKER_ALLOW_WRITES=1)", usage = 'flag "--dry-run" help="Preview what would be done without making changes"', run = ".venv/bin/python scripts/purge_gcs_legacy.py{% if usage.dry_run %} --dry-run{% endif %}" }
  # ── Kotlin Multiplatform (ui/kmp) ──────────────────────────────────────────
  "ui:kmp:build" = { description = "Build all KMP targets and modules in ui/kmp", run = "cd ui/kmp && ./gradlew build -x test" }
  "ui:kmp:clean" = { description = "Clean Gradle build artifacts in ui/kmp", run = "cd ui/kmp && ./gradlew clean" }
  "ui:kmp:test" = { description = "Run KMP unit tests across shared modules", run = "cd ui/kmp && ./gradlew :shared:jvmTest" }
  "ui:kmp:desktop:run" = { description = "Run the Compose Desktop (JVM) application", run = "cd ui/kmp && ./gradlew :apps-desktop:run" }
  "ui:kmp:desktop:package" = { description = "Package Compose Desktop application for current OS", run = "cd ui/kmp && ./gradlew :apps-desktop:packageDistributionForCurrentOS" }
  "ui:kmp:android:assemble" = { description = "Assemble Android debug APK (:apps-android:assembleDebug)", run = "cd ui/kmp && ./gradlew :apps-android:assembleDebug" }
  "ui:kmp:android:bundle" = { description = "Bundle Android release AAB (:apps-android:bundleRelease)", run = "cd ui/kmp && ./gradlew :apps-android:bundleRelease" }
  "ui:kmp:android:install" = { description = "Install Android debug APK on connected device (:apps-android:installDebug)", run = "cd ui/kmp && ./gradlew :apps-android:installDebug" }
  "ui:kmp:web:wasm:dev" = { description = "Run Web application in browser using Wasm development server", run = "cd ui/kmp && ./gradlew :apps-web:wasmJsBrowserDevelopmentRun" }
  "ui:kmp:web:wasm:dist" = { description = "Assemble Web Wasm distribution bundle", run = "cd ui/kmp && ./gradlew :apps-web:wasmJsBrowserDistribution" }
  "ui:kmp:web:js:dev" = { description = "Run Web application in browser using JS development server", run = "cd ui/kmp && ./gradlew :apps-web:jsBrowserDevelopmentRun" }
  "ui:kmp:web:js:dist" = { description = "Assemble Web JS distribution bundle", run = "cd ui/kmp && ./gradlew :apps-web:jsBrowserDistribution" }
  detekt = { description = "Run Detekt static analysis across records and ui/kmp", run = "cd records && ./gradlew detekt; cd ../ui/kmp && ./gradlew detekt" }
  konsist = { description = "Run Konsist architectural test suites across records and ui/kmp", run = "cd records && ./gradlew :records-parser:test && cd ../ui/kmp && ./gradlew :apps-core:jvmTest" }
  lint = { description = "Run unified static analysis and architectural linting (Detekt + Konsist)", depends = ["detekt", "konsist"] }
  "ui:kmp:docs:readmes" = { description = "Verify all ui/kmp core and feature modules have valid README.md documentation", run = "bash scripts/check-kmp-readmes.sh" }
  "ui:kmp:docs:generate" = { description = "Generate unified multi-module Dokka API documentation HTML for ui/kmp", run = "cd ui/kmp && ./gradlew :dokkaGenerate" }
  "records:docs:generate" = { description = "Generate Dokka API documentation HTML for records", run = "cd records && ./gradlew :dokkaGenerate" }
  "docs:all" = { description = "Generate all workspace documentation (Dokka, README validations, task docs)", run = "mise run ui:kmp:docs:generate && mise run records:docs:generate && mise run ui:kmp:docs:readmes && mise run mise:docs:tasks" }
  "mise:docs:tasks" = {
    description = "Regenerates docs/mise (lints Usage specs, generates Markdown, and runs mise task-docs)",
    sources = "[mise.toml, scripts/specs/*.usage.kdl, records/proto/src/main/proto/tracker/v1/application.proto]",
    shell = "zsh -c",
    run = """
  # Sync proto to tracker.usage.kdl
  .venv/bin/python scripts/generate_tracker_usage.py

  # Lint all Usage specs first
  for spec in scripts/specs/*.usage.kdl; do
    mise x usage -- usage lint "$spec" --warnings-as-errors
  done

  # Generate base docs for all tasks (tui, report, mise:docs:tasks, etc.)
  mise generate task-docs -m -o ./docs/mise

  # Overwrite with Usage-generated Markdown for scripts with .usage.kdl specs
  for spec in scripts/specs/*.usage.kdl; do
    name="${spec%.usage.kdl}"
    name="${name##scripts/specs/}"
    mise x usage -- usage generate markdown --file "$spec" --out-file "docs/mise/${name}.md"
  done
"""
  }
  "completions:generate" = {
    description = "Generate Zsh completions from Usage specs and install to ~/.env/zsh/custom/completions/",
    sources = "[scripts/specs/*.usage.kdl, records/proto/src/main/proto/tracker/v1/application.proto]",
    shell = "zsh -c",
    run = """
  # Sync proto to tracker.usage.kdl
  .venv/bin/python scripts/generate_tracker_usage.py

  local completions_dir="$HOME/.env/zsh/custom/completions"
  mkdir -p "$completions_dir"

  for spec in scripts/specs/*.usage.kdl; do
    name="${spec%.usage.kdl}"
    name="${name##scripts/specs/}"
    out_file="${completions_dir}/completions-for-${name}.zsh"
    mise x usage -- usage generate completion zsh --file "$spec" "$name" > "$out_file"
    chmod +x "$out_file"
    echo "Generated: $out_file"
  done
"""
  }

[monorepo]
  lockfile = true
  config_roots = [ "ui/kmp", "ui/kotlin-toolchain" ]

[hooks]
  cd = "bash scripts/cleanup-tui-logs.sh"
