    "compose-foundation",
    "compose-material3",
    "compose-ui",
    "compose-components-resources",
    "compose-uiToolingPreview",
    "compose-material-icons-core",
    "kotlinx-collections-immutable",
  ]
  compose-tooling = [
    "compose-uiToolingPreview",
    "compose-uiTooling",
  ]
  ktor-client = [
    "ktor-client-core",
    "ktor-serialization-kotlinx-json",
    "ktor-content-negotiation",
  ]
  ktor-client-android = [
    "ktor-client-okhttp",
  ]
  ktor-client-ios = [
    "ktor-client-darwin",
  ]
  ktor-client-js = [
    "ktor-client-js",
  ]
  ktor-client-jvm = [
    "ktor-client-cio",
  ]
  firebase-android = [
    "firebase-firestore",
    "firebase-auth",
  ]
  firebase-jvm = [
    "firebase-admin",
  ]
  koin = [
    "koin-core",
    "koin-compose",
    "koin-viewmodel",
  ]
  androidx-lifecycle-compose = [
    "androidx-lifecycle-viewmodelCompose",
    "androidx-lifecycle-runtimeCompose",
  ]
  serialization = [
    "kotlinx-serialization-json",
  ]
  navigation3 = [
    "navigation3-runtime",
    "navigation3-ui",
  ]
  testing = [
    "kotlin-test",
    "kotlinx-coroutines-test",
    "kotlinx-serialization-json",
    "kotlinx-collections-immutable",
    "kotlinx-datetime",
  ]
  testing-jvm = [
    "junit",
    "kotlin-testJunit",
  ]
  testing-android = [
    "androidx-testExt-junit",
    "androidx-testRunner",
  ]
  room = [
    "androidx-room3-runtime",
    "androidx-room3-common",
  ]
  sqlite-bundled = [
    "androidx-sqlite-bundled",
  ]
  sqlite-web = [
    "androidx-sqlite-web",
    "wrappers-browser",
  ]

[plugins]
  androidApplication = { id = "com.android.application", version.ref = "agp" }
  androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
  composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
  composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
  kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
  kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
  kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
  googleServices = { id = "com.google.gms.google-services", version.ref = "googlePlayServices" }
  local-multiplatform-library = { id = "dev.fnc314.tools.jobtracker.multiplatform-library" }
  ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

  # Local Functional Cause Plugins
  local-kotlin-multiplatform = { id = "dev.fnc314.tools.jobtracker.kotlin-multiplatform" }
  local-kotlin-jvm = { id = "dev.fnc314.tools.jobtracker.kotlin-jvm" }
