[versions]
  agp = "9.5.0"
  android-compileSdk = "37"
  android-minSdk = "24"
  android-targetSdk = "37"
  androidx-activity = "1.13.0"
  androidx-appcompat = "1.8.0"
  androidx-core = "1.19.1"
  androidx-espresso = "3.7.0"
  androidx-lifecycle = "2.11.0"
  androidx-testExt = "1.3.0"
  androidx-testRunner = "1.7.0"
  androidx-credentials = "1.5.0"
  google-id = "1.1.1"
  composeMultiplatform = "1.12.2"
  composeMaterialIcons = "1.7.3"
  firebase-bom = "35.1.0"
  firebase-auth = "25.0.0"
  firebase-firestore = "27.1.0"
  firebase-admin = "9.5.0"
  junit = "4.13.2"
  koin = "4.2.2"
  kotlin = "2.4.21"
  kotlin-wrappers = "2026.11.0"
  kotlinx-coroutines = "1.11.0"
  kotlinx-datetime = "0.8.0"
  kotlinx-serialization = "1.12.0"
  ktor = "3.6.1"
  material3 = "1.12.0-alpha03"
  mockk = "1.14.11"
  navigation-compose = "2.10.0"
  navigation3 = "1.2.0"
  jvm = "17"
  googlePlayServices = "4.5.0"
  node = "26.13.0"

[libraries]
  kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
  kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
  junit = { module = "junit:junit", version.ref = "junit" }
  androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
  androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
  androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
  androidx-testRunner = { module = "androidx.test:runner", version.ref = "androidx-testRunner" }
  androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
  androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
  androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
  androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
  google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "google-id" }
  compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
  androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
  androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
  compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
  compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
  compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
  compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
  compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
  compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
  kotlinx-coroutinesSwing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
  kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
  kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
  kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
  wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlin-wrappers" }
  compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "composeMaterialIcons" }
  firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
  firebase-firestore = { module = "com.google.firebase:firebase-firestore", version.ref = "firebase-firestore" }
  firebase-auth = { module = "com.google.firebase:firebase-auth", version.ref = "firebase-auth" }
  firebase-admin = { module = "com.google.firebase:firebase-admin", version.ref = "firebase-admin" }
  koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
  koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
  koin-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
  ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
  ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
  ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
  ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
  ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
  ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
  ktor-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
  navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
  navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
  navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
  mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
  android-gradle-plugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "agp" }

[bundles]
  compose-ui = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-ui",
    "compose-components-resources",
    "compose-uiToolingPreview",
    "compose-material-icons-core",
  ]
  compose-tooling = [
    "compose-uiToolingPreview",
    "compose-uiTooling",
  ]
  ktor-client = [
    "ktor-client-core",
    "ktor-serialization-kotlinx-json",
    "ktor-content-negotiation",
  ]
  ktor-client-android = [
    "ktor-client-okhttp",
  ]
  ktor-client-ios = [
    "ktor-client-darwin",
  ]
  ktor-client-js = [
    "ktor-client-js",
  ]
  ktor-client-jvm = [
    "ktor-client-cio",
  ]
  firebase-android = [
    "firebase-firestore",
    "firebase-auth",
  ]
  firebase-jvm = [
    "firebase-admin",
  ]
  koin = [
    "koin-core",
    "koin-compose",
    "koin-viewmodel",
  ]
  androidx-lifecycle-compose = [
    "androidx-lifecycle-viewmodelCompose",
    "androidx-lifecycle-runtimeCompose",
  ]
  serialization = [
    "kotlinx-serialization-json",
  ]

[plugins]
  androidApplication = { id = "com.android.application", version.ref = "agp" }
  androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
  composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
  composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
  kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
  kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
  kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
  googleServices = { id = "com.google.gms.google-services", version.ref = "googlePlayServices" }
  local-multiplatform-library = { id = "dev.fnc314.tools.jobtracker.multiplatform-library" }
