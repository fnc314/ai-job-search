  local-dependencies-di = { id = "dev.fnc314.tools.jobtracker.dependencies.di" }
  local-dependencies-koin = { id = "dev.fnc314.tools.jobtracker.dependencies.koin" }
  local-dependencies-ktor = { id = "dev.fnc314.tools.jobtracker.dependencies.ktor" }
  local-dependencies-serialization = { id = "dev.fnc314.tools.jobtracker.dependencies.serialization" }
  local-dependencies-navigation = { id = "dev.fnc314.tools.jobtracker.dependencies.navigation" }
  local-dependencies-datasource = { id = "dev.fnc314.tools.jobtracker.dependencies.datasource" }
