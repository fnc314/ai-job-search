group=dev.fnc314.aijobtracker
version=2.8.0

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=2048M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.unsafe.isolated-projects=false
org.gradle.unsafe.typesafe-project-accessors=true
# org.gradle.configureondemand=true
# Enable Parallel Sync for Gradle 9.4+
org.gradle.tooling.parallel=false

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableR8.fullMode=true
android.sync.suppressAgpWarnings=GENERIC,UNSUPPORTED_PROJECT_OPTION_USE
kotlin.native.ignoreDisabledTargets=true
